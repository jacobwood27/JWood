<!DOCTYPE html> <html lang=en > <meta charset=utf-8  /> <meta name=viewport  content="width=device-width, initial-scale=1" /> <title>Metronome (HTML + Vanilla JS)</title> <style> :root { --bg: #0f172a; /* slate-900 */ --card: #111827; /* gray-900 */ --ink: #e5e7eb; /* gray-200 */ --accent: #60a5fa; /* blue-400 */ --accent-2: #a78bfa; /* violet-400 */ --muted: #9ca3af; /* gray-400 */ } html, body { height: 100%; margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji"; color: var(--ink); background: radial-gradient(1200px 800px at 50% -20%, #1f2937, var(--bg)); } .wrap { min-height: 100%; display: grid; place-items: center; padding: 24px; } .card { width: min(680px, 92vw); background: linear-gradient(180deg, rgba(255,255,255,0.05), transparent), var(--card); border: 1px solid rgba(255,255,255,0.08); border-radius: 20px; padding: 24px; box-shadow: 0 20px 60px rgba(0,0,0,0.35); } h1 { margin: 0 0 8px; font-size: clamp(20px, 2.2vw, 28px); letter-spacing: 0.2px; } .sub { color: var(--muted); margin-bottom: 20px; font-size: 14px; } .grid { display: grid; gap: 18px; } @media (min-width: 700px) { .grid { grid-template-columns: 1.2fr 1fr; align-items: start; } } /* Controls */ .control { display: grid; gap: 10px; } label { font-size: 13px; color: var(--muted); } .row { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; } input[type="number"] { width: 120px; padding: 10px 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.03); color: var(--ink); font-size: 16px; -moz-appearance: textfield; } input[type="number"]::-webkit-outer-spin-button, input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; } input[type="range"] { width: 100%; appearance: none; height: 10px; background: linear-gradient(90deg, var(--accent), var(--accent-2)); border-radius: 999px; outline: none; opacity: 0.9; } input[type="range"]::-webkit-slider-thumb { appearance: none; width: 22px; height: 22px; border-radius: 50%; background: #fff; border: 2px solid #00000020; box-shadow: 0 3px 8px rgba(0,0,0,0.35); cursor: pointer; } input[type="range"]::-moz-range-thumb { width: 22px; height: 22px; border-radius: 50%; background: #fff; border: none; box-shadow: 0 3px 8px rgba(0,0,0,0.35); cursor: pointer; } .btn { display: inline-flex; gap: 8px; align-items: center; justify-content: center; border: 1px solid rgba(255,255,255,0.14); padding: 10px 14px; border-radius: 12px; color: var(--ink); background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02)); cursor: pointer; user-select: none; font-weight: 600; transition: transform .04s ease, filter .15s ease; } .btn:active { transform: translateY(1px) scale(0.99); } .btn.primary { border-color: transparent; background: linear-gradient(90deg, var(--accent), var(--accent-2)); color: #0b1020; } .row-buttons { display: flex; gap: 10px; flex-wrap: wrap; } /* Visual pulse */ .viz { display: grid; place-items: center; padding: 12px; } .pulse-wrap { width: min(340px, 70vw); aspect-ratio: 1/1; border-radius: 50%; background: radial-gradient(40% 40% at 50% 50%, rgba(96,165,250,0.25), rgba(167,139,250,0.12), transparent 70%); display: grid; place-items: center; } .pulse { width: 120px; height: 120px; border-radius: 50%; background: conic-gradient(from 0deg, var(--accent), var(--accent-2)); filter: drop-shadow(0 10px 25px rgba(96,165,250,0.25)); transform: scale(0.92); transition: transform 100ms ease; } .pulse.on { transform: scale(1.08); } .readout { margin-top: 14px; font-variant-numeric: tabular-nums; color: var(--muted); font-size: 14px; } .mini { font-size: 12px; color: var(--muted); } .unit-toggle { display: inline-flex; border-radius: 10px; overflow: hidden; border: 1px solid rgba(255,255,255,0.12); } .unit-toggle button { all: unset; padding: 6px 10px; cursor: pointer; background: transparent; color: var(--ink); font-size: 12px; } .unit-toggle button.active { background: rgba(255,255,255,0.1); } </style> <div class=wrap > <div class=card  role=application  aria-label=Metronome > <h1>Metronome</h1> <div class=sub >Set the tempo with the number box or the slider. Press Start to begin.</div> <div class=grid > <section class=control  aria-label=Controls > <div class=row > <div> <label for=tempoInput >Tempo</label> <div style="display:flex; gap:8px; align-items:center; flex-wrap: wrap;"> <input id=tempoInput  type=number  min=10  max=300  step=1  value=100  inputmode=numeric  aria-describedby=tempoHelp  /> <span id=unitLabel >BPM</span> <span class=mini  id=tempoHelp >Range: 10–300 BPM</span> </div> </div> <div class=unit-toggle  role=tablist  aria-label=Unit > <button id=btnBPM  class=active  role=tab  aria-selected=true  title="Beats per minute">BPM</button> <button id=btnHz  role=tab  aria-selected=false  title="Beats per second (Hz)">Hz</button> </div> </div> <div> <input id=tempoSlider  type=range  min=10  max=300  value=100  step=1  aria-label="Tempo slider" /> </div> <div class=row-buttons > <button id=startBtn  class="btn primary" aria-pressed=false >Start</button> <button id=stopBtn  class=btn  disabled>Stop</button> <button id=tapBtn  class=btn  title="Tap tempo (click repeatedly)">Tap</button> <span class=mini  id=latencyInfo  aria-live=polite ></span> </div> </section> <section class=viz  aria-label="Visual beat indicator"> <div class=pulse-wrap > <div class=pulse  id=pulse ></div> </div> <div class=readout > <span id=readBpm >100 BPM</span> <span class=mini > • period <span id=readMs >600</span> ms</span> </div> </section> </div> </div> </div> <script> (() => { // --- State & DOM const tempoInput = document.getElementById('tempoInput'); const tempoSlider = document.getElementById('tempoSlider'); const startBtn = document.getElementById('startBtn'); const stopBtn = document.getElementById('stopBtn'); const tapBtn = document.getElementById('tapBtn'); const pulseEl = document.getElementById('pulse'); const readBpmEl = document.getElementById('readBpm'); const readMsEl = document.getElementById('readMs'); const latencyEl = document.getElementById('latencyInfo'); const btnBPM = document.getElementById('btnBPM'); const btnHz = document.getElementById('btnHz'); const unitLabel = document.getElementById('unitLabel'); const MIN_BPM = 10, MAX_BPM = 300; let useHz = false; // false = BPM mode, true = Hz mode // Web Audio scheduling let audioCtx = null; let nextNoteTime = 0.0; // in audio context time const scheduleAheadTime = 0.1; // seconds to schedule ahead const lookahead = 25; // ms timer resolution let timerId = null; let running = false; let beatCounter = 0; // Helpers const clamp = (n, min, max) => Math.min(max, Math.max(min, n)); const bpmToSec = (bpm) => 60.0 / bpm; const hzToBpm = (hz) => hz * 60; const bpmToHz = (bpm) => bpm / 60; function getTempoBpm() { let val = parseFloat(tempoInput.value); if (Number.isNaN(val)) val = 100; if (useHz) { // Input is Hz, convert to BPM for scheduling val = hzToBpm(val); } return clamp(val, MIN_BPM, MAX_BPM); } function setTempoUIFromBpm(bpm) { const _bpm = clamp(bpm, MIN_BPM, MAX_BPM); const display = useHz ? (bpmToHz(_bpm)) : _bpm; const rounded = useHz ? Math.max(0.1, +display.toFixed(2)) : Math.round(display); tempoInput.value = rounded; tempoSlider.value = Math.round(_bpm); updateReadout(_bpm); } function updateReadout(bpmVal) { const bpm = clamp(bpmVal ?? getTempoBpm(), MIN_BPM, MAX_BPM); readBpmEl.textContent = `${Math.round(bpm)} BPM`; readMsEl.textContent = Math.round(bpmToSec(bpm) * 1000); } function flashPulse() { pulseEl.classList.add('on'); setTimeout(() => pulseEl.classList.remove('on'), 90); } function clickSound(time, accented=false) { if (!audioCtx) return; // Short tick using an oscillator + gain envelope const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain(); osc.type = 'square'; osc.frequency.setValueAtTime(accented ? 1600 : 1000, time); // Envelope: very fast attack, quick decay const g = accented ? 0.15 : 0.08; gain.gain.setValueAtTime(0.0001, time); gain.gain.exponentialRampToValueAtTime(g, time + 0.002); gain.gain.exponentialRampToValueAtTime(0.0001, time + 0.05); osc.connect(gain).connect(audioCtx.destination); osc.start(time); osc.stop(time + 0.06); } // Schedule one note if it falls within the next scheduleAheadTime function schedulerTick() { const currentTime = audioCtx.currentTime; while (nextNoteTime < currentTime + scheduleAheadTime) { const accented = (beatCounter % 4 === 0); // simple accent every 4 beats clickSound(nextNoteTime, accented); // Schedule a visual sync (uses rAF close to audio time) const target = nextNoteTime; const scheduleVisual = () => { const dt = (audioCtx.currentTime - target); if (dt >= -0.01) { // near target time flashPulse(); } else { requestAnimationFrame(scheduleVisual); } }; requestAnimationFrame(scheduleVisual); const secondsPerBeat = bpmToSec(getTempoBpm()); nextNoteTime += secondsPerBeat; beatCounter++; } } function start() { if (running) return; if (!audioCtx) { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); measureLatency().catch(()=>{}); } else if (audioCtx.state === 'suspended') { audioCtx.resume(); } running = true; startBtn.setAttribute('aria-pressed', 'true'); stopBtn.disabled = false; startBtn.disabled = true; nextNoteTime = audioCtx.currentTime + 0.05; // small offset beatCounter = 0; timerId = setInterval(schedulerTick, lookahead); } function stop() { if (!running) return; running = false; startBtn.setAttribute('aria-pressed', 'false'); stopBtn.disabled = true; startBtn.disabled = false; clearInterval(timerId); timerId = null; } // Estimate output latency (very rough; for display only) async function measureLatency() { if (!audioCtx) return; try { const base = audioCtx.baseLatency || 0; const out = audioCtx.outputLatency || 0; const total = ((base + out) * 1000); if (total > 0) { latencyEl.textContent = `~${Math.round(total)} ms device latency`; } else { latencyEl.textContent = ''; } } catch { latencyEl.textContent = ''; } } // TAP TEMPO const tapTimes = []; tapBtn.addEventListener('click', () => { const t = performance.now(); tapTimes.push(t); // Keep the last 8 taps while (tapTimes.length > 8) tapTimes.shift(); if (tapTimes.length >= 2) { // compute intervals let sum = 0, n = 0; for (let i = 1; i < tapTimes.length; i++) { const dt = tapTimes[i] - tapTimes[i-1]; if (dt > 200 && dt < 3000) { // ignore crazy outliers sum += dt; n++; } } if (n > 0) { const avgMs = sum / n; const bpm = clamp(60000 / avgMs, MIN_BPM, MAX_BPM); setTempoUIFromBpm(bpm); if (running) { // realign phase on tap nextNoteTime = audioCtx.currentTime + 0.05; beatCounter = 0; } } } }); // INPUT SYNC tempoInput.addEventListener('input', () => { let v = parseFloat(tempoInput.value); if (Number.isNaN(v)) return; // If Hz mode, clamp on BPM-equivalent and convert back to Hz for display step const bpm = useHz ? hzToBpm(v) : v; const clamped = clamp(bpm, MIN_BPM, MAX_BPM); tempoSlider.value = Math.round(clamped); updateReadout(clamped); }); tempoInput.addEventListener('change', () => { // Snap text to slider range and reflect let v = parseFloat(tempoInput.value); if (Number.isNaN(v)) v = useHz ? bpmToHz(100) : 100; const bpm = useHz ? hzToBpm(v) : v; setTempoUIFromBpm(bpm); }); tempoSlider.addEventListener('input', () => { const bpm = parseFloat(tempoSlider.value); setTempoUIFromBpm(bpm); }); startBtn.addEventListener('click', start); stopBtn.addEventListener('click', stop); // Unit toggle (BPM / Hz) function setUnit(isHz) { if (useHz === isHz) return; const currentBpm = getTempoBpm(); // read as BPM regardless of current unit useHz = isHz; btnHz.classList.toggle('active', useHz); btnBPM.classList.toggle('active', !useHz); unitLabel.textContent = useHz ? 'Hz' : 'BPM'; // Update min/max labels when in Hz (derived) const minHz = (MIN_BPM / 60).toFixed(2); const maxHz = (MAX_BPM / 60).toFixed(2); document.getElementById('tempoHelp').textContent = useHz ? `Range: ${minHz}–${maxHz} Hz` : `Range: ${MIN_BPM}–${MAX_BPM} BPM`; // Reflect the same tempo in the new unit setTempoUIFromBpm(currentBpm); } btnBPM.addEventListener('click', () => setUnit(false)); btnHz.addEventListener('click', () => setUnit(true)); // Keyboard shortcuts: Space toggles start/stop window.addEventListener('keydown', (e) => { if (e.code === 'Space') { e.preventDefault(); running ? stop() : start(); } }); // Initialize UI setTempoUIFromBpm(100); })(); </script>
